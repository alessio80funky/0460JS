<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <title>ローディング中の画面を作ろう</title>
    <style>
        /* ローディング画面 */
#loading {
  transition: all 1s;
  background-color: #ddd;
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
}
.spinner {
  width: 200px;
  height: 200px;
}

/* ローディング完了したらローディング画面を隠す */
.loaded {
  opacity: 0;
  visibility: hidden;
}

/* コンテンツ部分 */
.gallery {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}
img {
  width: 100%;
  height: 300px;
  object-fit: cover;
}
    </style>
</head>

<!--ローディング画面-->

<body>
<div id="loading">
<img class="spinner"  alt="" srcset="6-dots-scale-middle.svg" width="200" height="auto">
</div>
